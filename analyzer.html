<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTTP/HTTPS Analyzer</title>
  <link rel="stylesheet" href="analyzer.css">
</head>
<body>
  <main class="analyzer">
    <header>
      <div class="antet">
      <h1>HTTP/HTTPS Analyzer</h1>
      <button id="refresh" type="button" title="Reîncarcă site-ul">↻</button>
    </div>

      <div class="info-site">
        <span>Host: <strong id="site-host">—</strong></span>
        <span>Protocol: <strong id="site-protocol">—</strong></span>
        <span>IP: <strong id="site-ip">—</strong></span>
        <span>Status: <strong id="site-status">—</strong></span>
      </div>

      <p>Introdu adresa site-ului pe care vrei să îl analizezi.</p>
    </header>

    <form id="url-form">
      <label for="url-input">Adresa site-ului</label>
      <input
        id="url-input"
        name="url"
        type="text"
        placeholder="https://example.com"
        autocomplete="url"
        required
      >
      <button type="submit">Analizează</button>
    </form>

    <p id="status" role="status" aria-live="polite">
      Introdu un link pentru a începe.
    </p>

    <div class="antet-cereri">
      <h2>Cereri capturate</h2>
      <span id="statistici">0 requests | — seconds</span>
    </div>
    <div class="container-tabel">
      <table id="tabel-cereri">
        <colgroup>
          <col style="width: 70px">
          <col style="width: 160px">
          <col style="width: 210px">
          <col style="width: 70px">
          <col style="width: 70px">
          <col style="width: 100px">
          <col style="width: 80px">
        </colgroup>
        <thead>
          <tr>
            <th>ID</th>
            <th>Request domain</th>
            <th>Request name</th>
            <th>Method</th>
            <th>Status</th>
            <th>Type</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="lista-cereri"></tbody>
      </table>
    </div>
  </main>

  <script src="analyzer.js" defer></script>
</body>
</html>
